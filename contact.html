<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Contact | DataByElijah</title>

    <style>
        /* Base Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a; 
            color: #f8fafc; 
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar (Updated for Multi-Page) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 5%; 
            background-color: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 100px; 
            width: auto;
            vertical-align: middle;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        /* Updated Links to point to separate HTML pages */
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #38bdf8;
        }

        .social-icons {
            display: flex;
            gap: 1.25rem;
            align-items: center;
            border-left: 1px solid #334155; 
            padding-left: 1.5rem;
        }

        .social-icons a {
            color: #cbd5e1;
            display: flex;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            color: #38bdf8;
            transform: translateY(-2px);
        }

        .social-icons svg {
            width: 22px;
            height: 22px;
            fill: currentColor; 
        }

        /* Contact Section Container */
        .contact-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4rem 5%;
        }

        .contact-wrapper {
            background-color: #1e293b;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .contact-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .contact-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 0.5rem;
        }

        .contact-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Form Styling */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        /* File Upload Styling */
        input[type="file"] {
            background-color: transparent;
            border: 1px dashed #475569;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            color: #94a3b8;
        }

        input[type="file"]:hover {
            border-color: #38bdf8;
            color: #f8fafc;
        }

        /* Submit Button */
        .btn-submit {
            grid-column: 1 / -1;
            padding: 1rem;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                display: none; 
            }
            
            .social-icons {
                border-left: none; 
                padding-left: 0;
            }
            
            .contact-wrapper {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

    <!-- Contact Form Section -->
    <main class="contact-container">
        <div class="contact-wrapper">
            <div class="contact-header">
                <h1>Project Inquiry</h1>
                <p>Provide a few details about your data landscape and business goals.</p>
            </div>

<!-- Forminit Integrated Contact Form -->
            <form action="https://forminit.com/f/h1720xf2qyl" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="fi-sender-fullName" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="fi-sender-email" required placeholder="john@company.com">
                </div>

                <div class="form-group full-width">
                    <label for="service">Primary Area of Focus</label>
                    <select id="service" name="fi-text-service" required>
                        <option value="" disabled selected>Select a service type...</option>
                        <option value="BI_Dashboards">Business Intelligence & Power BI</option>
                        <option value="Data_Engineering">Data Engineering & Pipelines</option>
                        <option value="Python_Automation">Python Workflow Automation</option>
                        <option value="AI_Integration">Applied AI & LLM Integration</option>
                        <option value="Other">Other / Not Sure</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="tech_stack">Current Tech Stack / Data Sources</label>
                    <input type="text" id="tech_stack" name="fi-text-techStack" placeholder="e.g., SQL Server, Excel, Shopify, Salesforce">
                </div>

                <div class="form-group full-width">
                    <label for="goals">What is the primary business goal of this project?</label>
                    <textarea id="goals" name="fi-text-goals" required placeholder="Describe what a successful outcome looks like (e.g., 'We need to cut manual reporting time in half' or 'We need to integrate our raw operational data into a central warehouse')."></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="reference_files">Reference Files (Optional)</label>
                    <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem;">Upload screenshots of current dashboards, architecture diagrams, or sample data images.</p>
                    <input type="file" id="reference_files" name="fi-file-referenceFiles" accept="image/png, image/jpeg, image/jpg, .pdf" multiple>
                </div>

                <button type="submit" class="btn-submit">Submit Project Inquiry</button>
            </form>
        </div>
    </main>
